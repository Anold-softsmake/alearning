name: Extract lecturer notes (temporary)
on:
  push:
    branches:
      - tools/extract-ai-lecturer-notes
    paths:
      - ".github/workflows/extract-ai-lecturer-notes.yml"
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install document parser
        run: python -m pip install python-docx
      - name: Extract Topic 1 lecturer document
        run: |
          python - <<'PY'
          from docx import Document
          from pathlib import Path
          path = Path("notes/YEAR 3/AI/Lesson 1 Introduction to Artificial Intelligence.docx")
          doc = Document(path)
          lines = []
          for p in doc.paragraphs:
              text = p.text.strip()
              if text:
                  lines.append(text)
          for ti, table in enumerate(doc.tables, 1):
              lines.append(f"\\n[TABLE {ti}]")
              for row in table.rows:
                  lines.append(" | ".join(cell.text.replace("\\n", " / ").strip() for cell in row.cells))
          Path("notes/YEAR 3/AI/extracted/Lesson 1 Introduction to Artificial Intelligence.txt").write_text("\\n".join(lines), encoding="utf-8")
          print(f"Extracted {len(lines)} text blocks.")
          PY
          mkdir -p "notes/YEAR 3/AI/extracted"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "notes/YEAR 3/AI/extracted/Lesson 1 Introduction to Artificial Intelligence.txt"
          git commit -m "Extract Topic 1 lecturer notes as text" || true
          git push
